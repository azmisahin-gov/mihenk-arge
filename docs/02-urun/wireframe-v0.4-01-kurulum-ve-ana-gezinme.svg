<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#edf1ee"/><text x="38" y="42" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="750" fill="#5d7668" text-anchor="start">MİHENK / ÜRÜN TASARIMI</text><text x="38" y="78" font-family="Inter,Segoe UI,Arial" font-size="27" font-weight="750" fill="#1f332a" text-anchor="start">01 · Kurulum ve ana gezinme</text><text x="38" y="101" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="400" fill="#65766c" text-anchor="start">İlk kullanımda ana menü yok; kasa ve profil tamamlandıktan sonra uygulama kabuğu açılır.</text><text x="1560" y="50" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="700" fill="#728078" text-anchor="end">WIREFRAME v0.4 · 1/6</text><rect x="38" y="130" width="744" height="470" rx="9" fill="#fff" stroke="#d5ded8"/><text x="52" y="154" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#24342d" text-anchor="start">S-01 · İlk karşılama</text><text x="52" y="171" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">Yeni kasa oluşturma veya şifreli yedekten devam etme</text><rect x="50" y="185" width="720" height="404" rx="7" fill="#f7f9f7" stroke="#dfe7e1"/><text x="78" y="239" font-family="Inter,Segoe UI,Arial" font-size="25" font-weight="800" fill="#254638" text-anchor="start">MİHENK</text><text x="78" y="262" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="400" fill="#6c7a72" text-anchor="start">Bilirkişi çalışma alanı</text><text x="78" y="315" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#25332f" text-anchor="start">Görevlendirmenizi tek çalışma alanında yönetin.</text><text x="78" y="338" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#68766e" text-anchor="start">Belgeler, materyaller, inceleme, sorular ve rapor — tek yerde.</text><rect x="78" y="370" width="270" height="95" rx="7" fill="#fff" stroke="#dce5de"/><text x="92" y="396" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="700" fill="#25332f" text-anchor="start">Yerel ve korumalı çalışma</text><text x="92" y="418" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">Görev verileri bu cihazdaki şifreli kasada tutulur.</text><rect x="78" y="477" width="270" height="65" rx="7" fill="#fff" stroke="#dce5de"/><text x="92" y="503" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="700" fill="#25332f" text-anchor="start">İnsan denetimi</text><text x="92" y="523" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">Nihai inceleme ve resmî teslim sizde kalır.</text><rect x="375" y="249" width="340" height="260" rx="7" fill="#fff" stroke="#dce5de"/><text x="395" y="278" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" fill="#25332f" text-anchor="start">Nasıl devam etmek istersiniz?</text><rect x="395" y="297" width="300" height="72" rx="7" fill="#f7faf7" stroke="#b9cbbf"/><text x="411" y="325" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="700" fill="#315f4b" text-anchor="start">＋  Yeni yerel kasa oluştur</text><text x="411" y="346" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#718078" text-anchor="start">İlk kez kullanıyorsanız</text><rect x="395" y="383" width="300" height="72" rx="7" fill="#fff" stroke="#dce5de"/><text x="411" y="411" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="700" fill="#25332f" text-anchor="start">↗  Şifreli yedekten geri yükle</text><text x="411" y="432" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#718078" text-anchor="start">Mevcut kasanız varsa</text><text x="395" y="486" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">UYAP hesabı veya e-imza PIN'i istenmez.</text><rect x="818" y="130" width="744" height="470" rx="9" fill="#fff" stroke="#d5ded8"/><text x="832" y="154" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#24342d" text-anchor="start">S-02 / S-05 · Kasa oluşturma ve sonraki açılış</text><text x="832" y="171" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">Kurulum ve kilit açma ayrı durumlar; uygulama menüsü henüz görünmez</text><rect x="830" y="185" width="720" height="404" rx="7" fill="#f7f9f7" stroke="#dfe7e1"/><rect x="845" y="200" width="320" height="325" rx="7" fill="#fff" stroke="#dce5de"/><text x="862" y="228" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" fill="#25332f" text-anchor="start">Yeni kasa oluştur</text><rect x="862" y="246" width="286" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="872" y="261" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Kasa adı</text><text x="872" y="279" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">Çalışma kasam</text><rect x="862" y="301" width="286" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="872" y="316" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Yeni kasa parolası</text><text x="872" y="334" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">••••••••••••</text><rect x="862" y="356" width="286" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="872" y="371" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Parolayı tekrar girin</text><text x="872" y="389" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">••••••••••••</text><rect x="862" y="416" width="286" height="50" rx="7" fill="#fff7e9" stroke="#ead9b7"/><text x="874" y="436" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#795c2a" text-anchor="start">Parola kaybolursa kasa açılamayabilir.</text><text x="874" y="452" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#795c2a" text-anchor="start">Şifreli yedek oluşturmayı unutmayın.</text><rect x="1185" y="200" width="320" height="325" rx="7" fill="#fff" stroke="#dce5de"/><text x="1203" y="228" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" fill="#25332f" text-anchor="start">Mevcut kasayı aç</text><text x="1203" y="258" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#718078" text-anchor="start">Sonraki açılışta kullanıcı bu ekranı görür.</text><rect x="1203" y="277" width="284" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="1213" y="292" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Kasa parolası</text><text x="1213" y="310" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">••••••••••••</text><rect x="1203" y="338" width="284" height="56" rx="7" fill="#edf5ef" stroke="#c8d8cd"/><text x="1217" y="362" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#315f4b" text-anchor="start">Kasa kilidi açılmaya hazır</text><text x="1217" y="379" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#66786d" text-anchor="start">Başarılı olunca Genel Bakış açılır.</text><text x="1203" y="427" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#748178" text-anchor="start">Parola sıfırlama için arka kapı yoktur.</text><text x="1203" y="444" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#748178" text-anchor="start">Yedek geri yükleme ayrı güvenli akıştır.</text><rect x="1203" y="470" width="284" height="28" rx="5" fill="#315f4b" stroke="#315f4b"/><text x="1345" y="489" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Kasayı aç</text><text x="845" y="554" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#718078" text-anchor="start">Kasa parolası ≠ UYAP parolası ≠ e-imza PIN'i.</text><rect x="38" y="630" width="744" height="470" rx="9" fill="#fff" stroke="#d5ded8"/><text x="52" y="654" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#24342d" text-anchor="start">S-03 / S-04 · Bilirkişi profili ve uzmanlık alanları</text><text x="52" y="671" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">Kurulum sihirbazı; ana sol menü henüz yok</text><rect x="50" y="685" width="720" height="404" rx="7" fill="#f7f9f7" stroke="#dfe7e1"/><text x="70" y="712" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#397255" text-anchor="start">1  Kasa</text><text x="154" y="712" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#397255" text-anchor="start">2  Profil</text><text x="249" y="712" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#7b8980" text-anchor="start">3  Uzmanlık</text><line x1="70" y1="723" x2="700" y2="723" stroke="#e3e9e5"/><text x="70" y="753" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700" fill="#25332f" text-anchor="start">Bilirkişi profiliniz</text><text x="70" y="773" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#718078" text-anchor="start">Bilgileriniz rapor için saklanır; resmî sicil doğrulaması yapıldığı anlamına gelmez.</text><rect x="70" y="790" width="295" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="80" y="805" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Ad</text><text x="80" y="823" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">Adınız</text><rect x="380" y="790" width="295" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="390" y="805" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Soyad</text><text x="390" y="823" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">Soyadınız</text><rect x="70" y="845" width="295" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="80" y="860" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Bilirkişi sicil numarası</text><text x="80" y="878" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">Sicil numarası</text><rect x="380" y="845" width="295" height="46" rx="5" fill="#fff" stroke="#d9e1dc"/><text x="390" y="860" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#748178" text-anchor="start">Meslekî unvan / sıfat</text><text x="390" y="878" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#25332f" text-anchor="start">Unvan veya sıfat</text><rect x="70" y="906" width="630" height="105" rx="7" fill="#fff" stroke="#dce5de"/><text x="84" y="930" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="700" fill="#25332f" text-anchor="start">Uzmanlık alanlarım</text><text x="84" y="950" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#718078" text-anchor="start">Meslekî beyanınız; MİHENK yazılım modülünden ayrı tutulur.</text><rect x="84" y="965" width="86.80000000000001" height="20" rx="10" fill="#e7f2eb" stroke="#e7f2eb"/><text x="127.4" y="979" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#397255" text-anchor="middle">56 · Bilişim</text><rect x="191" y="965" width="281.5" height="20" rx="10" fill="#f0f3f1" stroke="#f0f3f1"/><text x="331.75" y="979" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#68756e" text-anchor="middle">56.12 · Ses
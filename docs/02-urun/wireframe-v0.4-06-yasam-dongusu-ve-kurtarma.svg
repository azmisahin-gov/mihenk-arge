<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#edf1ee"/><text x="38" y="42" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="750" fill="#5d7668" text-anchor="start">MİHENK / ÜRÜN TASARIMI</text><text x="38" y="78" font-family="Inter,Segoe UI,Arial" font-size="27" font-weight="750" fill="#1f332a" text-anchor="start">06 · Tamamlayıcı akışlar ve durumlar</text><text x="38" y="101" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="400" fill="#65766c" text-anchor="start">Görev yaşam döngüsü, rapor revizyonu, çevrimdışı çalışma ve güncelleme hatası.</text><text x="1560" y="50" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="700" fill="#728078" text-anchor="end">WIREFRAME v0.4 · 6/6</text><rect x="38" y="130" width="744" height="470" rx="9" fill="#fff" stroke="#d5ded8"/><text x="52" y="154" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#24342d" text-anchor="start">S-28 · Görevi arşivleme / silme</text><text x="52" y="172" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">Görevi kapatmak, arşivlemek ve silmek farklı işlemlerdir.</text><rect x="50" y="185" width="720" height="400" rx="6" fill="#f7f9f7" stroke="#dfe7e1"/><rect x="70" y="211" width="680" height="344" rx="6" fill="#fff" stroke="#dce4df"/><text x="90" y="242" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700" fill="#25332f" text-anchor="start">Görevlerim</text><text x="90" y="269" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="650" fill="#25332f" text-anchor="start">2026/123 E. · Ses incelemesi</text><text x="90" y="293" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#748178" text-anchor="start">Durum: Rapor taslağı · 4 materyal · 3 soru</text><rect x="528" y="247" width="190" height="155" rx="6" fill="#fff" stroke="#cad7ce"/><text x="543" y="269" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#25332f" text-anchor="start">Görev işlemleri</text><text x="543" y="296" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">Görevi kapat</text><text x="543" y="321" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#315f4b" text-anchor="start">Arşive al</text><text x="543" y="346" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#a74e45" text-anchor="start">Görevi sil…</text><rect x="160" y="334" width="430" height="178" rx="8" fill="#fff" stroke="#d3b98d"/><rect x="179" y="349" width="84.6" height="18" rx="9" fill="#fff3df" stroke="#fff3df"/><text x="221.3" y="361" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#8a6428" text-anchor="middle">ETKİLİ İŞLEM</text><text x="179" y="393" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" fill="#25332f" text-anchor="start">Görevi arşive almak istiyor musunuz?</text><text x="179" y="418" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#69776f" text-anchor="start">Görev aktif listeden çıkar; kaynak dosyalar ve rapor</text><text x="179" y="433" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#69776f" text-anchor="start">kasada korunmaya devam eder.</text><rect x="179" y="461" width="112" height="28" rx="5" fill="#fff" stroke="#d5ded8"/><text x="235" y="479" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#47584e" text-anchor="middle">Vazgeç</text><rect x="300" y="461" width="158" height="28" rx="5" fill="#315f4b" stroke="#315f4b"/><text x="379" y="479" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Arşive al</text><rect x="818" y="130" width="744" height="470" rx="9" fill="#fff" stroke="#d5ded8"/><text x="832" y="154" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#24342d" text-anchor="start">S-21 · Tek rapor revizyon geçmişi</text><text x="832" y="172" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">Bir güncel ana rapor; yeniden oluşturulan her sürüm geçmişte korunur.</text><rect x="830" y="185" width="720" height="400" rx="6" fill="#f7f9f7" stroke="#dfe7e1"/><text x="848" y="216" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#25332f" text-anchor="start">Tek Rapor · 2026/123 E.</text><rect x="1385" y="199" width="49.8" height="18" rx="9" fill="#fff3df" stroke="#fff3df"/><text x="1409.9" y="211" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#8a6428" text-anchor="middle">TASLAK</text><rect x="848" y="244" width="674" height="65" rx="6" fill="#edf5ef" stroke="#c2d6c8"/><text x="862" y="267" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="750" fill="#25332f" text-anchor="start">Rapor v3</text><text x="962" y="267" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#65746b" text-anchor="start">15.11.2026 · 14:32</text><text x="862" y="289" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#748178" text-anchor="start">Güncel sürüm · profil ve görev anlık görüntüsü</text><rect x="1387" y="254" width="49.8" height="18" rx="9" fill="#e7f2eb" stroke="#e7f2eb"/><text x="1411.9" y="266" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#397255" text-anchor="middle">Güncel</text><text x="1493" y="292" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#315f4b" text-anchor="end">Önizle ›</text><rect x="848" y="322" width="674" height="65" rx="6" fill="#fff" stroke="#dce4df"/><text x="862" y="345" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="750" fill="#25332f" text-anchor="start">Rapor v2</text><text x="962" y="345" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#65746b" text-anchor="start">14.11.2026 · 18:10</text><text x="862" y="367" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#748178" text-anchor="start">Soru 2 yanıtı ve iki dayanak eklendi</text><rect x="1387" y="332" width="61.4" height="18" rx="9" fill="#f0f3f1" stroke="#f0f3f1"/><text x="1417.7" y="344" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#68756e" text-anchor="middle">Saklandı</text><text x="1493" y="370" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#315f4b" text-anchor="end">Karşılaştır ›</text><rect x="848" y="400" width="674" height="65" rx="6" fill="#fff" stroke="#dce4df"/><text x="862" y="423" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="750" fill="#25332f" text-anchor="start">Rapor v1</text><text x="962" y="423" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#65746b" text-anchor="start">14.11.2026 · 16:45</text><text x="862" y="445" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#748178" text-anchor="start">İlk rapor oluşturma</text><rect x="1387" y="410" width="61.4" height="18" rx="9" fill="#f0f3f1" stroke="#f0f3f1"/><text x="1417.7" y="422" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#68756e" text-anchor="middle">Saklandı</text><text x="1493" y="448" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#315f4b" text-anchor="end">Karşılaştır ›</text><rect x="848" y="491" width="674" height="48" rx="6" fill="#fff7e9" stroke="#ead9b7"/><text x="862" y="511" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#795c2a" text-anchor="start">Önceki rapor revizyonları, o sırada kullanılan model/run ve profil</text><text x="862" y="527" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#795c2a" text-anchor="start">bilgilerini korur; güncel model değişikliği geçmişi değiştirmez.</text><rect x="38" y="630" width="744" height="470" rx="9" fill="#fff" stroke="#d5ded8"/><text x="52" y="654" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#24342d" text-anchor="start">S-29 · Çevrimdışı çalışma / motor hazır değil</text><text x="52" y="672" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">Vaka sesleri yerelde kalır; yalnızca doğrulanmış model paketi gerekir.</text><rect x="50" y="685" width="720" height="400" rx="6" fill="#f7f9f7" stroke="#dfe7e1"/><rect x="68" y="701" width="680" height="95" rx="6" fill="#fff" stroke="#dce4df"/><text x="84" y="728" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="700" fill="#25332f" text-anchor="start">56.12 · Yerel işleme durumu</text><rect x="620" y="712" width="73" height="18" rx="9" fill="#e7f2eb" stroke="#e7f2eb"/><text x="656.5" y="724" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#397255" text-anchor="middle">ÇEVRİMDIŞI</text><text x="84" y="755" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">Görev ve mevcut kayıtlar yerelde erişilebilir; ASR modeli hazır değil.</text><text x="84" y="772" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">Model paketi önceden indirilmemiş veya checksum doğrulaması tamamlanmamış.</text><rect x="68" y="812" width="325" height="145" rx="6" fill="#fff" stroke="#dce4df"/><text x="78" y="830" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#25332f" text-anchor="start">Gerekli model paketi</text><text x="78" y="845" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="400" fill="#77847c" text-anchor="start">İzinli paket dosyasını yerel olarak içe aktarın.</text><text x="82" y="869" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">Paket: Yerel ASR adayı</text><text x="82" y="894" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#8a6428" text-anchor="start">Checksum: Doğrulama bekliyor</text><rect x="82" y="915" width="135" height="26" rx="5" fill="#315f4b" stroke="#315f4b"/><text x="149" y="932" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Paket seç</text><rect x="409" y="812" width="339" height="145" rx="6" fill="#fff" stroke="#dce4df"/><text x="419" y="830" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#25332f" text-anchor="start">Çalışma sınırı</text><text x="419" y="845" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="400" fill="#77847c" text-anchor="start">Ses ve transkript internet servisine gönderilmez.</text><text x="423" y="869" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">Model kurulum/güncellemesi ayrı işlem.</text><text x="423" y="894" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">Eski ASR run kayıtları korunur.</text><text x="423" y="919" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">Paket hazır olana kadar ASR bekler.</text><rect x="68" y="976" width="680" height="55" rx="6" fill="#eaf2ec" stroke="#ccdbd0"/><text x="82" y="999" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#3f674c" text-anchor="start">Görevler, profil ve yerel raporlar kullanılabilir. Model hazır olmadan</text><text x="82" y="1016" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#3f674c" text-anchor="start">sesin ASR işlemi başlamaz; kullanıcıya tamamlandı gösterilmez.</text><rect x="818" y="630" width="744" height="470" rx="9" fill="#fff" stroke="#d5ded8"/><text x="832" y="654" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#24342d" text-anchor="start">S-25 / S-27 · Güncelleme hatası ve tanılama</text><text x="832" y="672" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#7b8980" text-anchor="start">Güvenli geri dönüş; tanılama paketi içeriği kullanıcı tarafından incelenir.</text><rect x="830" y="685" width="720" height="400" rx="6" fill="#f7f9f7" stroke="#dfe7e1"/><rect x="848" y="701" width="318" height="190" rx="6" fill="#fff" stroke="#dce4df"/><text x="858" y="719" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#25332f" text-anchor="start">Güncelleme başarısız</text><text x="858" y="734" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="400" fill="#77847c" text-anchor="start">MİHENK 0.1.0-53 · Kararlı kanal</text><rect x="862" y="744" width="131" height="18" rx="9" fill="#fae9e7" stroke="#fae9e7"/><text x="927.5" y="756" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#a74e45" text-anchor="middle">KURULUM TAMAMLANMADI</text><text x="862" y="785" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#25332f" text-anchor="start">Paket doğrulaması tamamlanamadı.</text><text x="862" y="806" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">Mevcut sürüm ve kasa korunuyor.</text><text x="862" y="827" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">Olay kimliği: UPD-XXXX</text><rect x="862" y="847" width="128" height="27" rx="5" fill="#315f4b" stroke="#315f4b"/><text x="926" y="865" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Yeniden dene</text><rect x="1003" y="847" width="140" height="27" rx="5" fill="#fff" stroke="#d4ded7"/><text x="1073" y="865" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#3d5146" text-anchor="middle">Ayrıntıları gör</text><rect x="1182" y="701" width="346" height="190" rx="6" fill="#fff" stroke="#dce4df"/><text x="1192" y="719" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="700" fill="#25332f" text-anchor="start">Yerel tanılama</text><text x="1192" y="734" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="400" fill="#77847c" text-anchor="start">Gerçek görev içeriği destek paketine otomatik eklenmez.</text><text x="1196" y="785" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">• Uygulama sürümü ve platform</text><text x="1196" y="806" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">• Güvenli hata kimliği ve son adım</text><text x="1196" y="827" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#25332f" text-anchor="start">• Hassas içerik önizlemesi / hariç tutma</text><rect x="1196" y="847" width="176" height="27" rx="5" fill="#fff" stroke="#d4ded7"/><text x="1284" y="865" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="650" fill="#3d5146" text-anchor="middle">Paketi incele</text><rect x="848" y="910" width="680" height="120" rx="6" fill="#fff" stroke="#dce4df"/><text x="864" y="936" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="700" fill="#25332f" text-anchor="start">Güvenli kurtarma ilkesi</text><text x="864" y="963" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">• İmzalı paket ve manifest doğrulanmadan kurulum başarılı sayılmaz.</text><text x="864" y="984" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">• Başarısız güncelleme, son çalışan uygulama sürümünü veya kasa verisini silmez.</text><text x="864" y="1005" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">• Destek paketi yalnız kullanıcı dışa aktarmayı seçerse oluşturulur.</text><text x="38" y="1100" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#7b8980" text-anchor="start">TASLAK · İşlem başarısızlığı başarı gibi gösterilmez; veri koruması ve geri dönüş yolu görünür olmalıdır.</text></svg>
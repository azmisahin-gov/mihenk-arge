="8" font-weight="400" fill="#68766e" text-anchor="start">Destek paketi gerçek ses, transkript, dosya numarası veya taraf bilgisi içermez.</text><text x="862" y="950" font-family="Inter,Segoe UI,Arial" font-size="8" font-weight="400" fill="#68766e" text-anchor="start">Kullanıcı dışa aktarmadan önce içerik listesini inceler ve hariç tutabilir.</text><rect x="862" y="977" width="165" height="27" rx="5" fill="#fff" stroke="#d5ded8"/><text x="944" y="995" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="650" fill="#42564b" text-anchor="middle">Tanılama içeriğini gör</text><rect x="1038" y="977" width="150" height="27" rx="5" fill="#315f4b" stroke="#315f4b"/><text x="1113" y="995" font-family="Inter,Segoe UI,Arial" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">Destek paketi hazırla</text><text x="38" y="1100" font-family="Inter,Segoe UI,Arial" font-size="9" font-weight="400" fill="#7b8980" text-anchor="start">TASLAK · Uygulama tercihleri, güvenlik ve modül ayarları birbirine karışmaz; kullanıcı her ayarın sahibine gider.</text></svg>
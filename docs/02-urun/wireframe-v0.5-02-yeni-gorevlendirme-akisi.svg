<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120"><rect width="1680" height="1120" fill="#F3F5F8"/><text x="56" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#17263B" text-anchor="start">02  |  Yeni görevlendirme: otomatik kabul akışı</text><text x="56" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#66758A" text-anchor="start">Sihirbaz değil; tek bir taslak çalışma alanı. İlerlemeniz otomatik saklanır ve görev listesi her zaman erişilebilir.</text><rect x="36" y="116" width="228" height="910" rx="14" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="62" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263B" text-anchor="start">MİHENK</text><text x="62" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A8797" text-anchor="start">Bilirkişi çalışma alanı</text><text x="68" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">◫</text><text x="100" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Genel Bakış</text><rect x="48" y="208" width="204" height="42" rx="8" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="68" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#176F70" text-anchor="start">▤</text><text x="100" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#176F70" text-anchor="start">Görevlerim</text><text x="68" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">◈</text><text x="100" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Uzmanlık Modülleri</text><text x="68" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">▣</text><text x="100" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Kasa ve Güvenlik</text><text x="68" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">⚙</text><text x="100" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Uygulama Ayarları</text><line x1="54" y1="468" x2="246" y2="468" stroke="#D9E0E9" stroke-width="1" /><text x="62" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#8B97A6" text-anchor="start">BİLİRKİŞİ PROFİLİ</text><text x="62" y="534" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">Profilim  ·  Uzmanlıklarım</text><text x="62" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#627186" text-anchor="start">▤  Kasayı kilitle</text><text x="292" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#17263B" text-anchor="start">Yeni görevlendirme</text><text x="292" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#66758A" text-anchor="start">Belgeyi bırakın; MİHENK alanları ve beklenen materyalleri çıkarsın. Her adımda geri dönebilirsiniz.</text><rect x="1284" y="125" width="150" height="28" rx="14" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="1359" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#166B6B" text-anchor="middle">OTOMATİK KAYIT</text><rect x="292" y="202" width="1056" height="72" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="324" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8797" text-anchor="start">Görev oluşturma akışı</text><rect x="324" y="244" width="186" height="28" rx="14" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="417" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#166B6B" text-anchor="middle">1  BELGE EKLE</text><text x="526" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#A0AAB7" text-anchor="start">→</text><rect x="566" y="244" width="178" height="28" rx="14" fill="#EAF1F8" stroke="#EAF1F8" stroke-width="1"/><text x="655" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#48627B" text-anchor="middle">2  OTOMATİK OKU</text><text x="760" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#A0AAB7" text-anchor="start">→</text><rect x="800" y="244" width="188" height="28" rx="14" fill="#FFF4E3" stroke="#FFF4E3" stroke-width="1"/><text x="894" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92621A" text-anchor="middle">3  İSTİSNAYI ÇÖZ</text><text x="1004" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#A0AAB7" text-anchor="start">→</text><rect x="1044" y="244" width="250" height="28" rx="14" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="1169" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#176F70" text-anchor="middle">4  GÖREV ALANI</text><rect x="292" y="298" width="670" height="596" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="322" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263B" text-anchor="start">1  Görevlendirme belgesini ekleyin</text><text x="322" y="370" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#66758A" text-anchor="start">PDF, tarama veya desteklenen belge biçimi • birden fazla belge eklenebilir</text><rect x="322" y="394" width="610" height="150" rx="10" fill="#F7FAFC" stroke="#9DB8C6" stroke-width="2"/><text x="627" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#4B8293" text-anchor="middle">⇧</text><text x="627" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#234154" text-anchor="middle">Dosyaları buraya bırakın</text><text x="627" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="middle">veya dosya seçin  •  kaynak belgeler değiştirilmeden saklanır</text><text x="322" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17263B" text-anchor="start">2  MİHENK belgeyi otomatik inceler</text><rect x="322" y="606" width="140" height="28" rx="14" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="392" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#166B6B" text-anchor="middle">METİN ÇIKARILIYOR</text><text x="322" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">✓  Görevlendiren merci / dosya numarası</text><text x="322" y="694" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">✓  İnceleme konusu ve cevaplanacak sorular</text><text x="322" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">✓  Tarih, süre ve teslim bilgisi</text><text x="322" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">✓  Talep edilen / beklenen materyal listesi</text><text x="322" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#176F70" text-anchor="start">Yalnız belirsiz, çelişkili veya okunamayan alanlar size sorulur.</text><text x="322" y="840" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="start">Görev kaydı ilk belge eklendiğinde taslak olarak oluşur ve otomatik saklanır.</text><rect x="988" y="298" width="360" height="596" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="1014" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263B" text-anchor="start">Materyaller</text><text x="1014" y="370" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#66758A" text-anchor="start">Şimdi ekleyebilir veya sonra</text><rect x="1014" y="394" width="308" height="126" rx="10" fill="#F7FAFC" stroke="#D9E0E9" stroke-width="1"/><text x="1168" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#4B8293" text-anchor="middle">＋</text><text x="1168" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#234154" text-anchor="middle">Ses / video / ek belge ekle</text><text x="1168" y="489" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="middle">Birden fazla dosya seçilebilir</text><text x="1014" y="554" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#233247" text-anchor="start">Otomatik beklenen materyal listesi</text><rect x="1014" y="574" width="308" height="72" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="1032" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">Kayıt-01.wav</text><rect x="1196" y="582" width="108" height="28" rx="14" fill="#FFF4E3" stroke="#FFF4E3" stroke-width="1"/><text x="1250" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92621A" text-anchor="middle">BEKLENİYOR</text><text x="1032" y="627" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">Görevlendirme belgesinden çıkarıldı</text><rect x="1014" y="658" width="308" height="72" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="1032" y="685" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">USB içeriği</text><rect x="1196" y="666" width="108" height="28" rx="14" fill="#FFF4E3" stroke="#FFF4E3" stroke-width="1"/><text x="1250" y="685" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92621A" text-anchor="middle">BEKLENİYOR</text><text x="1032" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">Uzman teslim ettiğinde eklenecek</text><text x="1014" y="772" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#176F70" text-anchor="start">Eksik materyal, görevi açmayı engellemez.</text><text x="1014" y="798" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="start">Eksik kalanlar görev alanında görünür.</text><line x1="1014" y1="820" x2="1320" y2="820" stroke="#D9E0E9" stroke-width="1" /><text x="1014" y="852" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#176F70" text-anchor="start">Taslağı kaydet ve görev alanına geç  →</text><text x="292" y="936" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#66758A" text-anchor="start">GÖREVLERİM'e her zaman dönebilirsiniz  •  Açık görevler ve taslaklar kaybolmaz</text><text x="292" y="974" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92621A" text-anchor="start">Bu bir zorunlu ileri-geri sihirbazı değildir: belge eklendiğinde otomasyon başlar; materyal kabulü sonradan da sürdürülebilir.</text><text x="56" y="1080" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#7A8797" text-anchor="start">MİHENK • Wireframe v0.5 • Taslak; görsel tasarım ve uygulama kodlama onayı değildir</text></svg>
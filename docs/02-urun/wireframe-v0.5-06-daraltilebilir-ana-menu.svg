<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120"><rect width="1680" height="1120" fill="#F3F5F8"/><text x="56" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#17263B" text-anchor="start">06  |  Ana menünün geniş ve dar hâli</text><text x="56" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#66758A" text-anchor="start">Daraltma yeni bir gezinme sistemi oluşturmaz; aynı menü aynı sırayla, ikon ve araç ipuçlarıyla sürer.</text><rect x="44" y="118" width="1592" height="900" rx="16" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="78" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#176F70" text-anchor="start">GENİŞ MENÜ  •  varsayılan</text><text x="896" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#176F70" text-anchor="start">DAR MENÜ  •  bir tıklamayla geçiş</text><rect x="78" y="194" width="326" height="640" rx="12" fill="#F7F9FB" stroke="#D9E0E9" stroke-width="1"/><text x="104" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#17263B" text-anchor="start">MİHENK</text><text x="104" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A8797" text-anchor="start">Bilirkişi çalışma alanı</text><text x="116" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#66758A" text-anchor="start">◫</text><text x="156" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="start">Genel Bakış</text><rect x="94" y="350" width="294" height="48" rx="8" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="116" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#176F70" text-anchor="start">▤</text><text x="156" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#176F70" text-anchor="start">Görevlerim</text><text x="116" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#66758A" text-anchor="start">◈</text><text x="156" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="start">Uzmanlık Modülleri</text><text x="116" y="512" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#66758A" text-anchor="start">▣</text><text x="156" y="512" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="start">Kasa ve Güvenlik</text><text x="116" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#66758A" text-anchor="start">⚙</text><text x="156" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="start">Uygulama Ayarları</text><line x1="102" y1="654" x2="380" y2="654" stroke="#D9E0E9" stroke-width="1"/><text x="104" y="696" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#8B97A6" text-anchor="start">BİLİRKİŞİ PROFİLİ</text><text x="104" y="725" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">Profilim  ·  Uzmanlıklarım</text><text x="104" y="798" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#66758A" text-anchor="start">◀  Menüyü daralt</text><text x="548" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="600" fill="#9AA7B6" text-anchor="start">→</text><text x="924" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263B" text-anchor="start">MİHENK</text><text x="924" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A8797" text-anchor="start">Tooltip ile tam ad görünür</text><rect x="894" y="194" width="106" height="640" rx="12" fill="#F7F9FB" stroke="#D9E0E9" stroke-width="1"/><text x="947" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#66758A" text-anchor="middle">◫</text><rect x="907" y="349" width="80" height="52" rx="9" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="947" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#176F70" text-anchor="middle">▤</text><text x="947" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#66758A" text-anchor="middle">◈</text><text x="947" y="512" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#66758A" text-anchor="middle">▣</text><text x="947" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#66758A" text-anchor="middle">⚙</text><line x1="912" y1="654" x2="982" y2="654" stroke="#D9E0E9" stroke-width="1"/><text x="947" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#66758A" text-anchor="middle">●</text><text x="947" y="798" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#66758A" text-anchor="middle">›</text><rect x="1006" y="262" width="240" height="48" rx="8" fill="#17263B" stroke="#17263B" stroke-width="1"/><text x="1024" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">Görevlerim</text><text x="1006" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">Fareyle bekleyince görünür</text><rect x="1272" y="194" width="328" height="640" rx="12" fill="#FBFCFD" stroke="#D9E0E9" stroke-width="1"/><text x="1298" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8797" text-anchor="start">DAVRANIŞ</text><rect x="1296" y="266" width="38" height="38" rx="19" fill="#EEF2F7" stroke="#EEF2F7" stroke-width="1"/><text x="1315" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#526176" text-anchor="middle">1</text><text x="1348" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233247" text-anchor="start">Aynı menü öğeleri kalır</text><text x="1348" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">Yalnız metin etiketleri gizlenir.</text><rect x="1296" y="360" width="38" height="38" rx="19" fill="#EEF2F7" stroke="#EEF2F7" stroke-width="1"/><text x="1315" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#526176" text-anchor="middle">2</text><text x="1348" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233247" text-anchor="start">Aktif bölüm belirgin kalır</text><text x="1348" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">Renk ve arka plan seçili alanı gösterir.</text><rect x="1296" y="454" width="38" height="38" rx="19" fill="#EEF2F7" stroke="#EEF2F7" stroke-width="1"/><text x="1315" y="479" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#526176" text-anchor="middle">3</text><text x="1348" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233247" text-anchor="start">Araç ipucu açılır</text><text x="1348" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">İkon üzerinde bekleyince adı görünür.</text><rect x="1296" y="548" width="38" height="38" rx="19" fill="#EEF2F7" stroke="#EEF2F7" stroke-width="1"/><text x="1315" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#526176" text-anchor="middle">4</text><text x="1348" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233247" text-anchor="start">Klavye ile erişim</text><text x="1348" y="593" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">Sekme sırası ve erişilebilir ad korunur.</text><rect x="1296" y="642" width="38" height="38" rx="19" fill="#EEF2F7" stroke="#EEF2F7" stroke-width="1"/><text x="1315" y="667" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#526176" text-anchor="middle">5</text><text x="1348" y="664" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#233247" text-anchor="start">Tercih hatırlanır</text><text x="1348" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#66758A" text-anchor="start">Geniş/dar durumu bir sonraki açılışta korunur.</text><text x="78" y="900" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Görevlerim, Genel Bakış'tan ayrı bir ana menü öğesidir. Yeni görevlendirme açıldıktan sonra kullanıcı her an buraya dönerek önceki görevleri seçebilir.</text><text x="78" y="934" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#66758A" text-anchor="start">Dar menüde ikonlar aynı sırada ve aynı hedefe gider; menü daraldığında alt alanlar başka bir yere taşınmaz.</text><text x="78" y="984" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#8B97A6" text-anchor="start">Tasarım notu: simgeler örnektir; nihai ikonlar ve araç ipucu davranışı görsel tasarım aşamasında doğrulanır.</text><text x="56" y="1080" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#7A8797" text-anchor="start">MİHENK • Wireframe v0.5 • Taslak; görsel tasarım ve uygulama kodlama onayı değildir</text></svg>
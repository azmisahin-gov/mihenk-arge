<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120"><rect width="1680" height="1120" fill="#F3F5F8"/><text x="56" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#17263B" text-anchor="start">01  |  Bilgi mimarisi: Uzmanlık alanı ≠ modül ≠ motor</text><text x="56" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#66758A" text-anchor="start">Nereye tıklayınca ne açılıyor? Motor ayarı 56.12'nin içinde; bilirkişi profili ayrı.</text><rect x="36" y="116" width="228" height="910" rx="14" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="62" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263B" text-anchor="start">MİHENK</text><text x="62" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#7A8797" text-anchor="start">Bilirkişi çalışma alanı</text><text x="68" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">◫</text><text x="100" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Genel Bakış</text><text x="68" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">▤</text><text x="100" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Görevlerim</text><rect x="48" y="266" width="204" height="42" rx="8" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="68" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#176F70" text-anchor="start">◈</text><text x="100" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#176F70" text-anchor="start">Uzmanlık Modülleri</text><text x="68" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">▣</text><text x="100" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Kasa ve Güvenlik</text><text x="68" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#637286" text-anchor="start">⚙</text><text x="100" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">Uygulama Ayarları</text><line x1="54" y1="468" x2="246" y2="468" stroke="#D9E0E9" stroke-width="1" /><text x="62" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#8B97A6" text-anchor="start">BİLİRKİŞİ PROFİLİ</text><text x="62" y="534" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">Profilim  ·  Uzmanlıklarım</text><text x="62" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#627186" text-anchor="start">▤  Kasayı kilitle</text><text x="292" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#17263B" text-anchor="start">Uzmanlık Modülleri</text><text x="292" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#66758A" text-anchor="start">Meslekî uzmanlık alanı değil; MİHENK'in sunduğu iş araçları ve iş akışları.</text><rect x="292" y="202" width="862" height="720" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="322" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#17263B" text-anchor="start">56.12  Ses Kayıtlarının Metne Dönüştürülmesi</text><rect x="930" y="220" width="185" height="28" rx="14" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="1022.5" y="239" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#166B6B" text-anchor="middle">İLK AKTİF MODÜL</text><text x="322" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#66758A" text-anchor="start">Görevlendirme içindeki sesleri yerel olarak yazıya dönüştürme ve uzman kontrolü.</text><rect x="316" y="302" width="816" height="54" rx="8" fill="#F6F8FA" stroke="#E5EAF0" stroke-width="1"/><text x="340" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#176F70" text-anchor="start">Genel Bakış</text><text x="490" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">Motorlar ve Modeller</text><text x="690" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">Ses Araçları</text><text x="830" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">Dil ve Metin</text><text x="990" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">Test Geçmişi</text><line x1="318" y1="358" x2="1132" y2="358" stroke="#E1E7EF" stroke-width="1" /><rect x="318" y="380" width="490" height="210" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="344" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#7A8797" text-anchor="start">ÇALIŞAN İŞLEM ZİNCİRİ</text><rect x="344" y="440" width="118" height="60" rx="8" fill="#EAF3F6" stroke="#C7DDE5" stroke-width="1"/><text x="403" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#234154" text-anchor="middle">Ses ön</text><text x="403" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#52677B" text-anchor="middle">kontrol</text><text x="475" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#7890A0" text-anchor="start">→</text><rect x="512" y="440" width="118" height="60" rx="8" fill="#EAF3F6" stroke="#C7DDE5" stroke-width="1"/><text x="571" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#234154" text-anchor="middle">Konuşma</text><text x="571" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#52677B" text-anchor="middle">algılama</text><text x="643" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#7890A0" text-anchor="start">→</text><rect x="680" y="440" width="102" height="60" rx="8" fill="#E8F4F3" stroke="#9BC9C5" stroke-width="1"/><text x="731" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#176F70" text-anchor="middle">ASR</text><text x="731" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#176F70" text-anchor="middle">taslak</text><text x="344" y="548" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="start">Opsiyonel: konuşmacı ayrımı • noktalama • kanal analizi</text><text x="344" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#A34F3D" text-anchor="start">Metin anlamı / yorum / otomatik kanaat üretimi yok.</text><rect x="826" y="380" width="306" height="210" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="850" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#7A8797" text-anchor="start">ETKİN YEREL PROFİL</text><text x="850" y="455" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17263B" text-anchor="start">Motor: doğrulanan aday</text><rect x="850" y="472" width="128" height="28" rx="14" fill="#FFF4E3" stroke="#FFF4E3" stroke-width="1"/><text x="914" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92621A" text-anchor="middle">PİLOTTA SEÇİLECEK</text><text x="850" y="530" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#66758A" text-anchor="start">Model ve sürüm</text><text x="850" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Testten sonra sabitlenir</text><text x="850" y="576" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#176F70" text-anchor="start">Görev başına tekrar seçim yok</text><rect x="318" y="608" width="814" height="282" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="344" y="646" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8797" text-anchor="start">MOTORLAR VE MODELLER  (yalnız modül yöneticisi / bilirkişi ayarı)</text><rect x="344" y="666" width="768" height="56" rx="8" fill="#F8FAFC" stroke="#E4E9F0" stroke-width="1"/><text x="364" y="689" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#233247" text-anchor="start">Whisper ailesi / yerel paket</text><rect x="930" y="677" width="118" height="28" rx="14" fill="#E8F4F3" stroke="#E8F4F3" stroke-width="1"/><text x="989" y="696" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#166B6B" text-anchor="middle">ADAY</text><text x="364" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="start">Türkçe veri setiyle karşılaştırılacak; üretim kazananı değil.</text><rect x="344" y="736" width="768" height="56" rx="8" fill="#F8FAFC" stroke="#E4E9F0" stroke-width="1"/><text x="364" y="759" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#233247" text-anchor="start">SEDA</text><rect x="930" y="747" width="118" height="28" rx="14" fill="#FFF4E3" stroke="#FFF4E3" stroke-width="1"/><text x="989" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92621A" text-anchor="middle">DENEYSEL</text><text x="364" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="start">Mevcut yerel deneme; tek başına tercih edilmiş motor sayılmaz.</text><text x="344" y="833" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#233247" text-anchor="start">Dil / NLP yardımcıları</text><text x="344" y="859" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#66758A" text-anchor="start">Noktalama ve konuşmacı gruplama gerektiğinde etkinleşir; sözcükleri yeniden yazmaz.</text><rect x="1180" y="202" width="462" height="720" rx="12" fill="#FFFFFF" stroke="#D9E0E9" stroke-width="1"/><text x="1210" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17263B" text-anchor="start">BU SAYFANIN YERİ</text><rect x="1210" y="270" width="402" height="120" rx="10" fill="#EEF5F7" stroke="#D6E5EA" stroke-width="1"/><text x="1232" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#234154" text-anchor="start">Bilirkişi Profilim</text><text x="1232" y="328" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#52677B" text-anchor="start">Meslekî uzmanlık alanlarım / sicil</text><text x="1232" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#52677B" text-anchor="start">Kullanıcıya ait kimlik ve yetkinlik</text><text x="1232" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#8B97A6" text-anchor="start">↓  AYRI MENÜ</text><rect x="1210" y="440" width="402" height="120" rx="10" fill="#EEF5F7" stroke="#D6E5EA" stroke-width="1"/><text x="1232" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#234154" text-anchor="start">Uzmanlık Modülleri</text><text x="1232" y="498" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#52677B" text-anchor="start">56.12 gibi ürün içi iş akışları</text><text x="1232" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5267